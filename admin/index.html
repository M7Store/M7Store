<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>M7Store | Admin</title>

    <link rel="stylesheet" href="./admin.css">
</head>

<body>

    <div class="login-container">

        <h1>M7Store Admin</h1>

        <p>Entre para acessar o painel administrativo.</p>

        <form id="loginForm">

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

        </form>

        <div id="message"></div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./admin.js?v=1"></script>

</body>

</html>
